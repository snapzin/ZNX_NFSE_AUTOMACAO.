<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assinar — TáBatido</title>
<style>
  :root { --bg:#0b0b0c; --card:#161618; --line:#2a2a2e; --txt:#f2f2f3; --txt2:#9a9aa2; --accent:#34c759; --err:#ff453a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:520px; margin:48px auto; padding:0 16px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p.sub { color:var(--txt2); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  .fld { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .fld label { font-size:12px; color:var(--txt2); }
  input, select { background:#0f0f11; border:1px solid var(--line); color:var(--txt);
                  border-radius:8px; padding:10px 12px; font-size:14px; width:100%; }
  .planos { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .plano { border:1px solid var(--line); border-radius:10px; padding:12px; cursor:pointer; }
  .plano.sel { border-color:var(--accent); background:rgba(52,199,89,.08); }
  .plano b { display:block; }
  .plano span { color:var(--txt2); font-size:12px; }
  button { width:100%; cursor:pointer; border:none; background:var(--accent); color:#04140a;
           border-radius:10px; padding:12px 14px; font-size:14px; font-weight:700; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); margin-top:10px; }
  button:disabled { opacity:.6; cursor:default; }
  #msg { margin-top:14px; font-size:13px; }
  #msg.err { color:var(--err); }
  #msg.ok { color:var(--accent); }
  .pix-valor { font-size:26px; font-weight:800; margin:0 0 14px; text-align:center; }
  .pix-codigo { background:#0f0f11; border:1px solid var(--line); border-radius:8px; padding:12px;
                font-family:ui-monospace,Consolas,monospace; font-size:12px; word-break:break-all;
                color:var(--txt2); margin-bottom:12px; max-height:120px; overflow-y:auto; }
  .pix-qr { display:block; margin:0 auto 16px; width:200px; height:200px; border-radius:8px;
            background:#fff; padding:8px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TáBatido</h1>
  <p class="sub">Assine e pague via PIX na hora — a chave chega por e-mail assim que o pagamento for confirmado.</p>

  <form id="form" class="card" onsubmit="enviar(event)">
    <div class="fld"><label>Nome do escritório</label><input id="clientName" required /></div>
    <div class="fld"><label>CNPJ (ou CPF)</label><input id="cnpj" required inputmode="numeric" /></div>
    <div class="fld"><label>E-mail</label><input id="email" type="email" required /></div>

    <div class="planos">
      <div class="plano sel" data-plano="basico" onclick="selecionarPlano(this)">
        <b>Básico — R$ 149,90/mês</b><span>1 máquina</span>
      </div>
      <div class="plano" data-plano="pro" onclick="selecionarPlano(this)">
        <b>Pro — R$ 249,90/mês</b><span>até 3 máquinas</span>
      </div>
    </div>

    <p class="sub" style="margin:-6px 0 14px; font-size:12px;">Pagamento via PIX.</p>
    <button id="btn" type="submit">Gerar cobrança PIX</button>
    <div id="msg"></div>
  </form>

  <div id="pix" class="card hidden">
    <div class="pix-valor" id="pixValor"></div>
    <img id="pixQr" class="pix-qr hidden" alt="QR code do PIX" />
    <p class="sub" style="margin-bottom:8px">Escaneie o QR code ou copie o código abaixo e cole no Pix Copia e Cola do app do seu banco:</p>
    <div class="pix-codigo" id="pixCodigo"></div>
    <button onclick="copiarPix()">Copiar código PIX</button>
    <button class="ghost" onclick="location.reload()">Assinar outro plano</button>
    <div id="pixMsg" class="sub" style="margin-top:10px"></div>
  </div>
</div>
<script>
let PLANO = 'basico';
let PIX_COPIA_COLA = '';

function selecionarPlano(el) {
  document.querySelectorAll('.plano').forEach((p) => p.classList.remove('sel'));
  el.classList.add('sel');
  PLANO = el.dataset.plano;
}

// Pre-seleciona o plano vindo da landing page (ex.: /assinar.html?plano=pro)
(function preSelecionarPlanoDaUrl() {
  const alvo = new URLSearchParams(location.search).get('plano');
  const el = alvo && document.querySelector(`.plano[data-plano="${alvo}"]`);
  if (el) selecionarPlano(el);
})();

async function enviar(ev) {
  ev.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  msg.className = ''; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Gerando cobrança...';

  const payload = {
    clientName: document.getElementById('clientName').value.trim(),
    cnpj: document.getElementById('cnpj').value.trim(),
    email: document.getElementById('email').value.trim(),
    plano: PLANO,
  };

  try {
    const r = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) throw new Error(d.message || 'Falha ao gerar cobrança.');

    PIX_COPIA_COLA = d.pixCopiaECola || '';
    document.getElementById('pixValor').textContent = 'R$ ' + Number(d.valor || 0).toFixed(2).replace('.', ',');
    document.getElementById('pixCodigo').textContent = PIX_COPIA_COLA;
    const pixQr = document.getElementById('pixQr');
    if (d.qrCodeDataUrl) {
      pixQr.src = d.qrCodeDataUrl;
      pixQr.classList.remove('hidden');
    } else {
      pixQr.classList.add('hidden');
    }
    document.getElementById('form').classList.add('hidden');
    document.getElementById('pix').classList.remove('hidden');
  } catch (e) {
    msg.className = 'err';
    msg.textContent = 'Erro: ' + e.message;
    btn.disabled = false; btn.textContent = 'Gerar cobrança PIX';
  }
}

function copiarPix() {
  const pixMsg = document.getElementById('pixMsg');
  navigator.clipboard?.writeText(PIX_COPIA_COLA)
    .then(() => { pixMsg.textContent = 'Código copiado! Cole no app do seu banco.'; })
    .catch(() => { pixMsg.textContent = 'Não consegui copiar automaticamente — selecione o código acima manualmente.'; });
}
</script>
</body>
</html>
